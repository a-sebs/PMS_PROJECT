services:
  - type: web
    name: aurora-pms-staging
    runtime: docker
    plan: free
    branch: develop
    autoDeployTrigger: checksPass
    healthCheckPath: /health  
    envVars:
      - key: SEED_STAGING
        value: 'true'
      - key: DATABASE_URL
        sync: false
      - key: SEED_PASSWORD
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: PORT
        value: '3000'
      - key: TRUST_PROXY
        value: 'true'
      - key: APP_TIMEZONE
        value: America/Guayaquil
